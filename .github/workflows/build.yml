name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/reader.test.cjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: malssum-web
          path: dist/
          if-no-files-found: error
